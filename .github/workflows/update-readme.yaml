name: Update README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      PROFILE_TOKEN: ${{ secrets.PROFILE_README_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update recent projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          humanize_time() {
            local created_at="$1"
            local midnight
            local elapsed
            local days
            local weeks
            local months
            local years

            midnight="$(date -u -d "${created_at}" "+%Y-%m-%d 00:00:00")"
            elapsed="$(($(date -u +%s) - $(date -u -d "${midnight}" +%s)))"

            if [[ "${elapsed}" -le 86400 ]]; then
              echo "today"
              return
            fi

            days="$((elapsed / 86400))"
            if [[ "${days}" -lt 7 ]]; then
              [[ "${days}" -eq 1 ]] && echo "1 day ago" || echo "${days} days ago"
              return
            fi

            if [[ "${days}" -lt 30 ]]; then
              weeks="$((days / 7))"
              [[ "${weeks}" -eq 1 ]] && echo "1 week ago" || echo "${weeks} weeks ago"
              return
            fi

            if [[ "${days}" -lt 365 ]]; then
              months="$((days / 30))"
              [[ "${months}" -eq 1 ]] && echo "1 month ago" || echo "${months} months ago"
              return
            fi

            years="$((days / 365))"
            [[ "${years}" -eq 1 ]] && echo "1 year ago" || echo "${years} years ago"
          }

          events="$(
            curl -fsSL \
              -H "Authorization: Bearer ${PROFILE_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/cyberbuff/events?per_page=100"
          )"

          projects="$(
            jq -rc '
              sort_by(.created_at) | reverse | .[] |
              if .type == "PushEvent" and .payload.ref == "refs/heads/main" then
                {
                  kind: "push",
                  repo: .repo.name,
                  url: ("https://github.com/" + .repo.name),
                  created: .created_at
                }
              elif .type == "PullRequestEvent" and .payload.action == "opened" then
                {
                  kind: "pr",
                  repo: .repo.name,
                  url: ("https://github.com/" + .repo.name),
                  created: .created_at
                }
              else empty end
            ' <<< "${events}" |
              while IFS= read -r item; do
                kind="$(jq -r '.kind' <<< "${item}")"
                repo="$(jq -r '.repo' <<< "${item}")"
                created="$(jq -r '.created' <<< "${item}")"
                meta="$(
                  curl -fsSL \
                    -H "Authorization: Bearer ${PROFILE_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${repo}"
                )"

                if [[ "${kind}" == "push" ]]; then
                  fork="$(jq -r '.fork' <<< "${meta}")"
                  [[ "${fork}" == "false" ]] || continue
                fi

                description="$(jq -r '.description // ""' <<< "${meta}")"
                private="$(jq -r '.private' <<< "${meta}")"
                age="$(humanize_time "${created}")"
                if [[ "${private}" == "true" ]]; then
                  jq -rn \
                    --arg repo "${repo}" \
                    --arg name "Private repository" \
                    --arg age "${age}" \
                    '[$repo, $name, "", "", $age] | @tsv'
                else
                  jq -rn \
                    --arg repo "${repo}" \
                    --arg name "${repo}" \
                    --arg url "https://github.com/${repo}" \
                    --arg description "${description}" \
                    --arg age "${age}" \
                    '[$repo, $name, $url, $description, $age] | @tsv'
                fi
              done |
              awk -F '\t' '
                count < 5 && !seen[$1]++ {
                  if ($3 == "") {
                    print "- " $2 " (" $5 ")"
                  } else if ($4 == "") {
                    print "- [" $2 "](" $3 ") (" $5 ")"
                  } else {
                    print "- [" $2 "](" $3 ") - " $4 " (" $5 ")"
                  }
                  count++
                }
              '
          )"

          tmp="$(mktemp)"
          awk -v projects="${projects}" '
            /<!-- RECENT-PROJECTS:START -->/ {
              print
              print projects
              skip = 1
              next
            }
            /<!-- RECENT-PROJECTS:END -->/ {
              skip = 0
              print
              next
            }
            !skip { print }
          ' README.md > "${tmp}"
          mv "${tmp}" README.md

      - name: Update recent writing
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import html
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          readme_path = "README.md"
          rss_url = "https://cyberbuff.dev/rss.xml"

          with urllib.request.urlopen(rss_url, timeout=30) as response:
            feed = ET.fromstring(response.read())

          posts = []
          for item in feed.findall("./channel/item")[:5]:
            title = item.findtext("title", "").strip()
            url = item.findtext("link", "").strip()
            description = html.unescape(item.findtext("description", "").strip())
            description = " ".join(description.split())
            pub_date = item.findtext("pubDate", "").strip()
            date = parsedate_to_datetime(pub_date).strftime("%b %-d, %Y")
            posts.append(f"- [{title}]({url}) - {description} ({date})")

          readme = open(readme_path, encoding="utf-8").read()
          section = "#### 📜 Recent writing\n\n" + "\n".join(posts) + "\n\n---"
          readme, replacements = re.subn(
            r"#### 📜 Recent writing\n\n.*?\n---",
            section,
            readme,
            count=1,
            flags=re.S,
          )
          if replacements != 1:
            raise SystemExit("Recent writing section not found in README.md")

          open(readme_path, "w", encoding="utf-8").write(readme)
          PY

      - name: Commit README updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet README.md; then
            exit 0
          fi

          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add README.md
          git commit -m "Update README"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push

      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ env.PROFILE_TOKEN }}
          committer_token: ${{ github.token }}
          filename: github-metrics.svg
          committer_message: Update GitHub metrics
          user: cyberbuff
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
